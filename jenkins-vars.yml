---

# jenkins variables
project_name: docker-nomacs
external_type: na
custom_version_command: "curl -sX GET https://api.github.com/repos/nomacs/nomacs/releases | jq -r '.[] | select(.prerelease != true) | select(.assets.[].name | contains(\"x86_64.AppImage\")) | select(.assets.[].name | contains(\"aarch64.AppImage\")) | .tag_name' | sort -rV | head -1"
custom_release_notes_command: |-
  curl -H "Authorization: token ${GITHUB_TOKEN}" -s https://api.github.com/repos/nomacs/nomacs/releases/tags/${EXT_RELEASE} | jq -r '. |.body' > releasebody.json
release_type: stable
release_tag: latest
ls_branch: main
repo_vars:
  - BUILD_VERSION_ARG = 'NOMACS_VERSION'
  - LS_USER = 'linuxserver'
  - LS_REPO = 'docker-nomacs'
  - CONTAINER_NAME = 'nomacs'
  - DOCKERHUB_IMAGE = 'linuxserver/nomacs'
  - DEV_DOCKERHUB_IMAGE = 'lsiodev/nomacs'
  - PR_DOCKERHUB_IMAGE = 'lspipepr/nomacs'
  - DIST_IMAGE = 'ubuntu'
  - MULTIARCH = 'true'
  - CI = 'true'
  - CI_WEB = 'true'
  - CI_PORT = '3001'
  - CI_SSL = 'true'
  - CI_DELAY = '120'
  - CI_DOCKERENV = ''
  - CI_AUTH = ''
  - CI_WEBPATH = ''
  - CI_WEB_SCREENSHOT_DELAY = '45'
